name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build for the box (mipsle softfloat)
        run: |
          v="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath \
            -ldflags "-s -w -X github.com/Xoltox/gonkd/internal/printer.Version=$v" \
            -o gonkd.mipsle ./cmd/gonkd
          cp files/gonkd.init gonkd.init
          sha256sum gonkd.mipsle gonkd.init > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" gonkd.mipsle gonkd.init SHA256SUMS --title "$GITHUB_REF_NAME" --notes-from-tag
