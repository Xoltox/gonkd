<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>forge</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; background: #14161a; color: #e8e8e8;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; display: inline-block; }
  .dot.ok { background: #3ecf5f; }
  .dot.err { background: #e5484d; }
  #connMsg { font-size: 12px; color: #e5484d; margin: 0 0 12px; min-height: 14px; }
  #errMsg { font-size: 12px; color: #e5484d; margin: 0 0 12px; min-height: 14px; white-space: pre-wrap; }
  .card {
    background: #1e2126; border: 1px solid #2c3038; border-radius: 10px;
    padding: 12px; margin-bottom: 12px;
  }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
    color: #9aa4b2; margin: 0 0 10px; }
  .temps { display: flex; gap: 16px; flex-wrap: wrap; }
  .temp { flex: 1; min-width: 120px; }
  .temp .val { font-size: 22px; font-weight: 600; }
  .temp .lbl { font-size: 12px; color: #9aa4b2; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  button {
    background: #2c3038; color: #e8e8e8; border: 1px solid #3a3f4a;
    border-radius: 8px; padding: 10px 8px; font-size: 14px; cursor: pointer;
  }
  button:active { background: #3a3f4a; }
  button.primary { background: #2d6cdf; border-color: #2d6cdf; color: #fff; }
  button.danger { background: #b23a3a; border-color: #b23a3a; color: #fff; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .jogpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 260px; }
  .progress-outer { background: #2c3038; border-radius: 6px; height: 10px; overflow: hidden; margin: 8px 0; }
  .progress-inner { background: #2d6cdf; height: 100%; width: 0%; transition: width .3s; }
  .filelist { max-height: 200px; overflow-y: auto; }
  .filerow { display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 1px solid #2c3038; gap: 6px; }
  .filerow .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  #console { background: #0c0d10; border-radius: 8px; padding: 8px; height: 160px;
    overflow-y: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
  input[type=text] {
    background: #14161a; border: 1px solid #3a3f4a; color: #e8e8e8; border-radius: 8px;
    padding: 8px; font-size: 14px; width: 100%;
  }
  .small { font-size: 12px; color: #9aa4b2; }
  select { background: #14161a; color: #e8e8e8; border: 1px solid #3a3f4a; border-radius: 8px; padding: 8px; }
  fieldset { border: none; margin: 0; padding: 0; }
</style>
</head>
<body>
<h1><span id="statusDot" class="dot"></span> forge <span class="small" id="stateText"></span></h1>
<div id="connMsg"></div>
<div id="errMsg"></div>

<fieldset id="controls">

<div class="card">
  <h2>Temperatures</h2>
  <div class="temps">
    <div class="temp"><div class="val" id="hotendVal">-- / --</div><div class="lbl">Hotend &deg;C</div></div>
    <div class="temp"><div class="val" id="bedVal">-- / --</div><div class="lbl">Bed &deg;C</div></div>
  </div>
  <div class="row" style="margin-top:10px">
    <button data-act="preheat-pla">PLA 200/60</button>
    <button data-act="preheat-petg">PETG 235/80</button>
    <button data-act="cooldown">Cooldown</button>
    <button data-act="fan-on">Fan On</button>
    <button data-act="fan-off">Fan Off</button>
  </div>
</div>

<div class="card">
  <h2>Job</h2>
  <div id="jobName" class="small">No active job</div>
  <div class="progress-outer"><div class="progress-inner" id="jobBar"></div></div>
  <div class="small" id="jobMeta"></div>
  <div class="row" style="margin-top:8px">
    <button id="btnPause" data-act="job-pause">Pause</button>
    <button id="btnResume" data-act="job-resume">Resume</button>
    <button class="danger" data-act="job-cancel">Cancel</button>
    <button class="danger" data-act="estop">EMERGENCY STOP</button>
  </div>
</div>

<div class="card">
  <h2>Move</h2>
  <div class="small" id="jobLockMsg"></div>
  <div class="row"><button class="joblock" data-cmd="G28">Home All</button>
    <button class="joblock" data-cmd="G28 X Y">Home XY</button>
    <button class="joblock" data-cmd="G28 Z">Home Z</button></div>
  <div class="row small">Jog step:
    <select id="jogStep"><option>0.1</option><option selected>1</option><option>10</option></select> mm
  </div>
  <div class="jogpad">
    <span></span><button class="joblock" data-jog="Y,1">Y+</button><span></span>
    <button class="joblock" data-jog="X,-1">X-</button><button class="joblock" data-jog="Z,1">Z+</button><button class="joblock" data-jog="X,1">X+</button>
    <span></span><button class="joblock" data-jog="Y,-1">Y-</button><span></span>
    <span></span><button class="joblock" data-jog="Z,-1">Z-</button><span></span>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="btnExtrude" class="joblock" data-extrude="5">Extrude 5mm</button>
    <button id="btnRetract" class="joblock" data-extrude="-5">Retract 5mm</button>
  </div>
</div>

<div class="card">
  <h2>Z Babystep</h2>
  <div class="row">
    <button data-baby="-0.05">-0.05</button>
    <button data-baby="-0.01">-0.01</button>
    <button data-baby="0.01">+0.01</button>
    <button data-baby="0.05">+0.05</button>
  </div>
  <div class="small">Total this session: <span id="babyTotal">0.000</span> mm</div>
  <div class="row" style="margin-top:6px"><button class="primary joblock" data-act="baby-save">Save (M500)</button></div>
</div>

<div class="card">
  <h2>SD Files</h2>
  <div class="filelist" id="filelist"><div class="small">Loading...</div></div>
  <div class="row" style="margin-top:8px">
    <input type="file" id="uploadFile" style="flex:1">
    <select id="uploadMode"><option value="sd">Upload to SD</option><option value="stream">Stream</option></select>
    <button class="primary" data-act="upload-print">Upload &amp; Print</button>
    <button data-act="upload-only">Upload Only</button>
  </div>
  <div class="small" id="uploadStatus"></div>
</div>

<div class="card">
  <h2>Console</h2>
  <div id="console"></div>
  <div class="row" style="margin-top:8px">
    <input type="text" id="cmdInput" placeholder="Send G-code...">
    <button data-act="send-cmd">Send</button>
  </div>
</div>

</fieldset>

<script>
'use strict';
let babyTotal = 0;
let lastState = null;

function api(path, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  return fetch(path, opts).then(r => {
    if (!r.ok) return r.text().then(t => { throw new Error(t || ('HTTP ' + r.status)); });
    return r.status === 204 ? null : r.json();
  });
}
function postJSON(path, body) {
  return api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
}
function cmd(g) { return postJSON('/forge/send', {cmd: g}); }

function jog(axis, dir) {
  const step = document.getElementById('jogStep').value;
  const dist = parseFloat(step) * dir;
  return postJSON('/forge/jog', {axis: axis, dist: dist, feed: 3000}).catch(showErr);
}
// Extrude/retract always move a fixed amount of filament, independent of
// the XYZ jog step selector (R-12: they used to be multiplied by it).
function extrudeFixed(mm) {
  return postJSON('/forge/jog', {axis: 'E', dist: mm, feed: 300}).catch(showErr);
}
function preheat(hotend, bed) { cmd('M104 S' + hotend).catch(showErr); cmd('M140 S' + bed).catch(showErr); }
function cooldown() { cmd('M104 S0').catch(showErr); cmd('M140 S0').catch(showErr); }
function fan(v) { cmd('M106 S' + v).catch(showErr); }
function babystep(delta) {
  postJSON('/forge/babystep', {deltaMm: delta}).then(() => {
    babyTotal += delta;
    document.getElementById('babyTotal').textContent = babyTotal.toFixed(3);
  }).catch(showErr);
}
function babystepSave() { postJSON('/forge/babystep', {save: true}).catch(showErr); }
function jobPause() { postJSON('/forge/job/pause').catch(showErr); }
function jobResume() { postJSON('/forge/job/resume').catch(showErr); }
function jobCancel() { if (confirm('Cancel the current job?')) postJSON('/forge/job/cancel').catch(showErr); }
function estop() { if (confirm('EMERGENCY STOP the printer now?')) postJSON('/forge/emergency').catch(showErr); }
function sendCmd() {
  const el = document.getElementById('cmdInput');
  if (!el.value.trim()) return;
  cmd(el.value.trim()).catch(showErr);
  el.value = '';
}
function showErr(e) {
  document.getElementById('errMsg').textContent = e && e.message ? e.message : String(e);
}

function doUpload(print) {
  const f = document.getElementById('uploadFile').files[0];
  if (!f) { alert('choose a file first'); return; }
  const mode = document.getElementById('uploadMode').value;
  const fd = new FormData();
  fd.append('file', f);
  fd.append('print', print ? 'true' : 'false');
  const statusEl = document.getElementById('uploadStatus');
  statusEl.textContent = 'Uploading...';
  fetch('/api/files/local?mode=' + encodeURIComponent(mode), {method: 'POST', body: fd})
    .then(r => { if (!r.ok) return r.text().then(t => { throw new Error(t); }); return r.json(); })
    .then(() => { statusEl.textContent = 'Upload accepted.'; refreshFiles(); })
    .catch(e => { statusEl.textContent = ''; showErr(e); });
}

function fmtTemp(v) { return (v === undefined || v === null) ? '--' : v.toFixed(1); }

function setDisconnected(disc) {
  document.getElementById('connMsg').textContent = disc ? 'printer disconnected, retrying...' : '';
  const els = document.querySelectorAll('#controls button');
  els.forEach(function (b) { b.disabled = disc; });
}

function refresh() {
  api('/forge/status').then(s => {
    document.getElementById('stateText').textContent = s.state || '';
    const dot = document.getElementById('statusDot');
    dot.className = 'dot ' + (s.state === 'error' ? 'err' : (s.connected ? 'ok' : ''));
    setDisconnected(!s.connected);
    document.getElementById('errMsg').textContent = s.lastError || '';

    const t = s.temps || {};
    document.getElementById('hotendVal').textContent = fmtTemp(t.HotendActual) + ' / ' + fmtTemp(t.HotendTarget);
    document.getElementById('bedVal').textContent = fmtTemp(t.BedActual) + ' / ' + fmtTemp(t.BedTarget);

    // Home/jog/extrude/M500 are disabled while a job owns the port
    // (uploading/printing/paused): a stray click must not move the head or
    // stall the MCU mid-print. Temps, babystep, pause/resume/cancel and
    // E-stop stay enabled in that state.
    const jobActive = s.state === 'uploading' || s.state === 'printing' || s.state === 'paused';
    document.getElementById('jobLockMsg').textContent = (jobActive && s.connected) ? 'move disabled while a job is active' : '';
    document.querySelectorAll('.joblock').forEach(function (b) {
      b.disabled = !s.connected || jobActive;
    });
    const hot = (t.HotendActual || 0) > 170;
    document.getElementById('btnExtrude').disabled = !hot || !s.connected || jobActive;
    document.getElementById('btnRetract').disabled = !hot || !s.connected || jobActive;

    if (s.job) {
      const label = s.state === 'uploading' ? 'uploading' : (s.job.mode || '');
      document.getElementById('jobName').textContent = s.job.filename + ' (' + label + ')';
      document.getElementById('jobBar').style.width = (s.job.progress || 0).toFixed(1) + '%';
      document.getElementById('jobMeta').textContent =
        (s.job.progress || 0).toFixed(1) + '%  elapsed ' + Math.round(s.job.elapsedSec || 0) + 's  eta ' + Math.round(s.job.etaSec || 0) + 's';
    } else {
      document.getElementById('jobName').textContent = 'No active job';
      document.getElementById('jobBar').style.width = '0%';
      document.getElementById('jobMeta').textContent = '';
    }
    const paused = s.state === 'paused';
    const printing = s.state === 'printing';
    document.getElementById('btnPause').style.display = printing ? '' : 'none';
    document.getElementById('btnResume').style.display = paused ? '' : 'none';

    if (lastState !== 'idle' && s.state === 'idle') {
      refreshFiles();
    }
    lastState = s.state;
  }).catch(() => {
    document.getElementById('statusDot').className = 'dot err';
    setDisconnected(true);
  });

  api('/forge/console').then(c => {
    const el = document.getElementById('console');
    el.textContent = (c.lines || []).join('\n');
    el.scrollTop = el.scrollHeight;
  }).catch(() => {});
}

function renderFiles(files) {
  const el = document.getElementById('filelist');
  while (el.firstChild) el.removeChild(el.firstChild);
  if (!files || files.length === 0) {
    const d = document.createElement('div');
    d.className = 'small';
    d.textContent = 'No files (or not yet refreshed)';
    el.appendChild(d);
    return;
  }
  files.forEach(function (f) {
    const row = document.createElement('div');
    row.className = 'filerow';

    const nameEl = document.createElement('span');
    nameEl.className = 'name';
    nameEl.textContent = f.long || f.short;
    row.appendChild(nameEl);

    const printBtn = document.createElement('button');
    printBtn.textContent = 'Print';
    printBtn.addEventListener('click', function () { printFile(f.short); });
    row.appendChild(printBtn);

    const delBtn = document.createElement('button');
    delBtn.textContent = 'Del';
    delBtn.addEventListener('click', function () { deleteFile(f.short); });
    row.appendChild(delBtn);

    el.appendChild(row);
  });
}

function refreshFiles(force) {
  api('/forge/files' + (force ? '?refresh=1' : '')).then(r => {
    renderFiles(r.files || []);
  }).catch(() => {});
}
function printFile(short) {
  postJSON('/forge/job/print', {name: short}).catch(showErr);
}
function deleteFile(short) {
  if (!confirm('Delete ' + short + '?')) return;
  postJSON('/forge/files/delete', {name: short})
    .then(() => refreshFiles(true))
    .catch(showErr);
}

document.getElementById('controls').addEventListener('click', function (ev) {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.cmd) { cmd(b.dataset.cmd).catch(showErr); return; }
  if (b.dataset.jog) {
    const parts = b.dataset.jog.split(',');
    jog(parts[0], parseFloat(parts[1]));
    return;
  }
  if (b.dataset.extrude) { extrudeFixed(parseFloat(b.dataset.extrude)); return; }
  if (b.dataset.baby) { babystep(parseFloat(b.dataset.baby)); return; }
  switch (b.dataset.act) {
    case 'preheat-pla': preheat(200, 60); break;
    case 'preheat-petg': preheat(235, 80); break;
    case 'cooldown': cooldown(); break;
    case 'fan-on': fan(255); break;
    case 'fan-off': fan(0); break;
    case 'job-pause': jobPause(); break;
    case 'job-resume': jobResume(); break;
    case 'job-cancel': jobCancel(); break;
    case 'estop': estop(); break;
    case 'baby-save': babystepSave(); break;
    case 'upload-print': doUpload(true); break;
    case 'upload-only': doUpload(false); break;
    case 'send-cmd': sendCmd(); break;
  }
});
document.getElementById('cmdInput').addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter') sendCmd();
});

refresh();
refreshFiles(true);
setInterval(refresh, 2000);
</script>
</body>
</html>
